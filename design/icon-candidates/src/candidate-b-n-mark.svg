<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="b-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2C36"/>
      <stop offset="1" stop-color="#17181D"/>
    </linearGradient>
    <!-- userSpaceOnUse keeps the three overlapping mark shapes color-continuous -->
    <linearGradient id="b-mark" gradientUnits="userSpaceOnUse" x1="282" y1="235" x2="742" y2="789">
      <stop offset="0" stop-color="#FFA653"/>
      <stop offset="0.55" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#EE5F04"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded square keeps the monogram inside the platform-safe area -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#b-tile)"/>

  <!-- Monogram N: two stems plus a diagonal band, all sharing one gradient -->
  <rect x="282" y="235" width="140" height="554" fill="url(#b-mark)"/>
  <rect x="602" y="235" width="140" height="554" fill="url(#b-mark)"/>
  <path fill="url(#b-mark)" d="M282 235 H422 L742 789 H602 Z"/>
</svg>
