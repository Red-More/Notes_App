<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="a-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA653"/>
      <stop offset="0.55" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#EE5F04"/>
    </linearGradient>
  </defs>

  <!-- macOS-style rounded square: 824px content area on a 1024px canvas, 185px radius -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#a-tile)"/>

  <!-- Page body with a cut top-right corner (fold) -->
  <path fill="#FFFDF7" d="
    M360 272
    H588
    L708 392
    V708
    A44 44 0 0 1 664 752
    H360
    A44 44 0 0 1 316 708
    V316
    A44 44 0 0 1 360 272
    Z"/>

  <!-- Fold flap: reads as the underside of the turned corner -->
  <path fill="#FFE2C6" d="M588 272 L708 392 H588 Z"/>

  <!-- Two thick text lines; 64px tall so they survive downscaling to 32px -->
  <rect x="380" y="540" width="264" height="64" rx="32" fill="#FF7A1A"/>
  <rect x="380" y="636" width="192" height="64" rx="32" fill="#FF7A1A"/>
</svg>
