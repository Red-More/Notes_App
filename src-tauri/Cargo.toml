[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# Android Keystore 依赖（android-native-keyring-store 1.0）要求 rustc ≥ 1.88。
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embedded llama.cpp runtime (phase B). Off by default so `cargo check` and the
# desktop dev loop do not need clang/cmake; enable for Android release builds.
local-llm = ["dep:llama-cpp-2"]
# Embedded MNN runtime for the Android comparison line. Off by default so the
# desktop dev loop does not need the NDK-built libMNN archive.
# `mnn-rs-sys` is used directly for streaming (`generate_init` / `generate_step` /
# `stoped`), which the high-level `mnn-rs` crate does not expose.
local-mnn = ["dep:mnn-rs", "dep:mnn-rs-sys"]

[[example]]
name = "mnn_smoke"
path = "examples/mnn_smoke.rs"
required-features = ["local-mnn"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["protocol-asset"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# 技能包导入：WebView 上传的 zip/.skill 以 base64 传入 Rust。
base64 = "0.22"
# Agent LLM 代理：唯一网络出口，SSE 流式转发；rustls 便于 Android 交叉编译。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
# Provider base URL validation: HTTPS-only, public host, no credentials.
url = "2"
# 媒体资产：内容哈希去重与十六进制文件名。
sha2 = "0.10"
# 实体库加盐哈希需要每次安装唯一的随机盐。
getrandom = "0.3"
# 可灵 API 使用 AccessKey/SecretKey 签发 HS256 JWT。
hmac = "0.12"
hex = "0.4"
# 视频作业轮询需要异步 sleep；sync 提供本地模型流式 chunk 的通道。
tokio = { version = "1", features = ["time", "sync"] }

# 阶段 B：内嵌 llama.cpp。仅 `local-llm` feature 启用，默认构建不引入 C/C++ 工具链依赖。
llama-cpp-2 = { version = "0.1", optional = true }

# MNN 推理引擎（对照线）：静态链接本地编译的 libMNN，禁用预编译下载。
mnn-rs = { version = "0.1.7", optional = true, default-features = false, features = ["cpu", "static", "llm"] }
# 原始 FFI：只有它能拿到 generate_init / generate_step / stoped，用于真流式与取消。
mnn-rs-sys = { version = "0.1.7", optional = true, default-features = false, features = ["cpu", "static", "llm"] }

# M2-4b：Android Keystore。凭据密文写 SharedPreferences，加密密钥由 Keystore 生成且不可导出。
# 仅 Android 目标编译；其 ndk-context 依赖已由 Tauri 的 tao 运行时初始化。
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0"
keyring-core = "1"
