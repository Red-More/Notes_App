[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# Android Keystore 依赖（android-native-keyring-store 1.0）要求 rustc ≥ 1.88。
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2"
# 长按菜单的粘贴：WebView 常拒绝异步剪贴板 API，改走 Rust 侧读取。
tauri-plugin-clipboard-manager = "2.5.0"
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# 技能包导入：WebView 上传的 zip/.skill 以 base64 传入 Rust。
base64 = "0.22"
# Agent LLM 代理：唯一网络出口，SSE 流式转发；rustls 便于 Android 交叉编译。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
# Provider base URL validation: HTTPS-only, public host, no credentials.
url = "2"
# 图片资产：内容哈希用于去重，十六进制哈希作为磁盘文件名。
sha2 = "0.10"
hex = "0.4"
# 发送前缩放：厂商对单图有硬上限，需在内存中解码并降级，不落盘。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# 取消与超时：select!、Notify 与测试运行时。
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }

# M2-4b：Android Keystore。凭据密文写 SharedPreferences，加密密钥由 Keystore 生成且不可导出。
# 仅 Android 目标编译；其 ndk-context 依赖已由 Tauri 的 tao 运行时初始化。
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0"
keyring-core = "1"
